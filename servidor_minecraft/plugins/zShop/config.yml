# ᴢSʜᴏᴘ Cᴏɴғɪɢᴜʀᴀᴛɪᴏɴ

# Gʀᴜɴᴅᴇɪɴsᴛᴇʟʟᴜɴɢᴇɴ
settings:
  # Pʀᴀ̈ғɪx ғᴜ̈ʀ ᴀʟʟᴇ Pʟᴜɢɪɴ-Nᴀᴄʜʀɪᴄʜᴛᴇɴ
  prefix: '&8[&b&3ᴢsʜᴏᴘ&8] &7'
  
  # Gʟᴏʙᴀʟᴇ Lᴏʀᴇ-Eɪɴsᴛᴇʟʟᴜɴɢᴇɴ ғᴜ̈ʀ ᴀʟʟᴇ Sʜᴏᴘ-Iᴛᴇᴍs
  # {price} ᴡɪʀᴅ ᴀᴜᴛᴏᴍᴀᴛɪsᴄʜ ᴅᴜʀᴄʜ ᴅᴇɴ ғᴏʀᴍᴀᴛɪᴇʀᴛᴇɴ Pʀᴇɪs ᴇʀsᴇᴛᴢᴛ
  item-lore:
  - '&7ᴘʀɪᴄᴇ: &a{price}'
  - ''
  - '&7ᴄʟɪᴄᴋ ᴛᴏ ᴘᴜʀᴄʜᴀsᴇ'
  
  # Gʟᴏʙᴀʟᴇ Lᴏʀᴇ-Eɪɴsᴛᴇʟʟᴜɴɢᴇɴ ғᴜ̈ʀ ᴀʟʟᴇ Kᴀᴛᴇɢᴏʀɪᴇ-Bᴜᴛᴛᴏɴs
  category-lore:
  - ''
  - '&7ᴄʟɪᴄᴋ ᴛᴏ ᴏᴘᴇɴ ᴛʜɪs ᴄᴀᴛᴇɢᴏʀʏ'

