# Pʟᴜɢɪɴ-Nᴀᴄʜʀɪᴄʜᴛᴇɴ
messages:
  player-only: ᴛʜɪs ᴄᴏᴍᴍᴀɴᴅ ᴄᴀɴ ᴏɴʟʏ ʙᴇ ᴜsᴇᴅ ʙʏ ᴘʟᴀʏᴇʀs.
  no-permission: ʏᴏᴜ ᴅᴏɴ'ᴛ ʜᴀᴠᴇ ᴘᴇʀᴍɪssɪᴏɴ ᴛᴏ ᴜsᴇ ᴛʜɪs ᴄᴏᴍᴍᴀɴᴅ.
  category-not-found: ᴛʜɪs ᴄᴀᴛᴇɢᴏʀʏ ᴡᴀs ɴᴏᴛ ғᴏᴜɴᴅ.
  item-not-found: ᴛʜɪs ɪᴛᴇᴍ ᴡᴀs ɴᴏᴛ ғᴏᴜɴᴅ.
  no-item-in-hand: ʏᴏᴜ ᴍᴜsᴛ ʜᴏʟᴅ ᴀɴ ɪᴛᴇᴍ ɪɴ ʏᴏᴜʀ ʜᴀɴᴅ.
  invalid-price: ᴛʜᴇ sᴘᴇᴄɪғɪᴇᴅ ᴘʀɪᴄᴇ ɪs ɪɴᴠᴀʟɪᴅ.
  invalid-slot: ᴛʜᴇ sᴘᴇᴄɪғɪᴇᴅ sʟᴏᴛ ɪs ɪɴᴠᴀʟɪᴅ. ᴄʜᴏᴏsᴇ ᴀ sʟᴏᴛ ʙᴇᴛᴡᴇᴇɴ %min% ᴀɴᴅ %max%.
  invalid-slot-format: ᴛʜᴇ sᴘᴇᴄɪғɪᴇᴅ sʟᴏᴛ ɪs ɴᴏᴛ ᴀ ᴠᴀʟɪᴅ ɴᴜᴍʙᴇʀ.
  item-added: ᴛʜᴇ ɪᴛᴇᴍ %item% ʜᴀs ʙᴇᴇɴ ᴀᴅᴅᴇᴅ ᴛᴏ ᴄᴀᴛᴇɢᴏʀʏ %category% ɪɴ sʟᴏᴛ %slot%
    ғᴏʀ %price%.
  config-reloaded: ᴛʜᴇ ᴄᴏɴғɪɢᴜʀᴀᴛɪᴏɴ ʜᴀs ʙᴇᴇɴ ʀᴇʟᴏᴀᴅᴇᴅ.
  purchase-successful: ʏᴏᴜ ᴘᴜʀᴄʜᴀsᴇᴅ %amount%x %item% ғᴏʀ %price%.
  not-enough-money: 'ʏᴏᴜ ᴅᴏɴ''ᴛ ʜᴀᴠᴇ ᴇɴᴏᴜɢʜ ᴍᴏɴᴇʏ. ᴘʀɪᴄᴇ: %price%'
  transaction-error: 'ᴀɴ ᴇʀʀᴏʀ ᴏᴄᴄᴜʀʀᴇᴅ ᴅᴜʀɪɴɢ ᴛʜᴇ ᴛʀᴀɴsᴀᴄᴛɪᴏɴ: %error%'
  inventory-full: ʏᴏᴜʀ ɪɴᴠᴇɴᴛᴏʀʏ ɪs ғᴜʟʟ.
sounds:
  menu_open:
    sound: BLOCK_CHEST_OPEN
    volume: 0.5
    pitch: 1.0
  menu_close:
    sound: BLOCK_CHEST_CLOSE
    volume: 0.5
    pitch: 1.0
  category_click:
    sound: UI_BUTTON_CLICK
    volume: 0.5
    pitch: 1.0
  item_click:
    sound: ENTITY_ITEM_PICKUP
    volume: 0.5
    pitch: 1.2
  amount_change:
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 0.3
    pitch: 1.5
  purchase_success:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.5
    pitch: 1.0
  purchase_failed:
    sound: ENTITY_VILLAGER_NO
    volume: 0.5
    pitch: 1.0
  inventory_full:
    sound: ENTITY_VILLAGER_NO
    volume: 0.5
    pitch: 0.8
  transaction_error:
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 0.5
    pitch: 0.5
  command_execute:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.5
    pitch: 1.2
